name: Release
on:
  push:
    tags: ['*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate tag and metadata
        run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm run build
      - run: node scripts/check-release.mjs --assets
      - uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" main.js manifest.json styles.css --verify-tag --title "LaTeX Live $RELEASE_TAG" --notes-file .github/release-notes.md
